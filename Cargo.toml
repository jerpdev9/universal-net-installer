[workspace]
resolver = "2"
members = [
    "crates/uni-core",
    "crates/uni-hardware",
    "crates/uni-network",
    "crates/uni-storage",
    "crates/uni-catalog",
    "crates/uni-downloader",
    "crates/uni-verifier",
    "crates/uni-installer",
    "crates/uni-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jerpdev9/universal-net-installer"

[workspace.dependencies]
uni-core = { path = "crates/uni-core" }
uni-hardware = { path = "crates/uni-hardware" }
uni-network = { path = "crates/uni-network" }
uni-storage = { path = "crates/uni-storage" }
uni-catalog = { path = "crates/uni-catalog" }
uni-downloader = { path = "crates/uni-downloader" }
uni-verifier = { path = "crates/uni-verifier" }
uni-installer = { path = "crates/uni-installer" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync"] }
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
